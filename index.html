<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبۆردی بەڕێوەبەر</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1, h3 { color: var(--primary); margin-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; outline: none; }
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background-color: var(--primary-dark); }
        .btn-danger { background-color: #ef4444; padding: 6px 12px; font-size: 14px; width: auto; }
        .btn-danger:hover { background-color: #dc2626; }
        .hidden { display: none !important; }
        .flex-row { display: flex; gap: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid var(--border-color); padding: 10px; text-align: center; }
        th { background-color: #eef2ff; color: var(--primary); }
        .alert { padding: 10px; background-color: #fee2e2; color: #b91c1c; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .success { background-color: #d1fae5; color: #065f46; }
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); display: flex; justify-content: center; align-items: center; z-index: 999; font-size: 18px; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div id="loadingOverlay" class="hidden">چاوەڕوانبە...</div>

<div class="container">
    <!-- چوونەژوورەوەی مدیر -->
    <div id="managerLoginSection" class="card">
        <h1>چوونەژوورەوەی بەڕێوەبەر</h1>
        <div id="loginAlert" class="alert hidden"></div>
        <div class="form-group">
            <label>ناوی بەکارهێنەر:</label>
            <input type="text" id="mUser" value="muder">
        </div>
        <div class="form-group">
            <label>پاسوۆرد:</label>
            <input type="password" id="mPass" placeholder="پاسوۆرد بنووسە">
        </div>
        <button onclick="managerLogin()">چوونە ژوورەوە</button>
    </div>

    <!-- داشبۆردی مدیر -->
    <div id="managerDashboard" class="card hidden">
        <h1>داشبۆردی بەڕێوەبەر (مدیر)</h1>
        <div style="text-align: left; margin-bottom: 15px;">
            <button class="btn-danger" onclick="logout()">چوونەدەرەوە</button>
        </div>

        <hr style="margin: 20px 0;">

        <h3>ناردنی نمرە بۆ قوتابی</h3>
        <div id="gradeAlert" class="alert hidden"></div>
        <div class="form-group">
            <label>ناوی بەکارهێنەری قوتابی (Username):</label>
            <input type="text" id="targetStudentUser" placeholder="یوزەری قوتابی بنووسە">
        </div>
        <div class="form-group">
            <label>بابەت یان کورتە:</label>
            <input type="text" id="gradeSubject" placeholder="بۆ نموونە: تاقیکردنەوەی کۆتایی">
        </div>
        <div class="form-group">
            <label>نمرەکان:</label>
            <textarea id="gradeDetails" rows="3" placeholder="وردەکاری نمرەکان..."></textarea>
        </div>
        <button onclick="uploadGrade()">ناردنی نمرە</button>

        <hr style="margin: 30px 0;">

        <h3>لیستی قوتابیان</h3>
        <div class="flex-row" style="margin-bottom: 15px;">
            <select id="filterStage" onchange="filterStudents()">
                <option value="">هەموو قۆناغەکان</option>
                <option value="قۆناغی 1">قۆناغی 1</option>
                <option value="قۆناغی 2">قۆناغی 2</option>
                <option value="قۆناغی 3">قۆناغی 3</option>
                <option value="قۆناغی 4">قۆناغی 4</option>
                <option value="قۆناغی 5">قۆناغی 5</option>
            </select>
            <input type="text" id="filterClass" placeholder="فلتەر بە کلاس..." onkeyup="filterStudents()">
        </div>

        <table>
            <thead>
                <tr>
                    <th>ناو</th>
                    <th>باوک</th>
                    <th>مۆبایل</th>
                    <th>قۆناغ</th>
                    <th>کلاس</th>
                    <th>یوزەرنەم</th>
                    <th>کردار</th>
                </tr>
            </thead>
            <tbody id="studentsTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const BIN_ID = '6ac8b0f699f2e6510825b27d';
    const API_KEY = '$2a$10$lFwaTUI.NEhF5OAB72t00.HD73fJHtk8FiK0EqrgAa3dQa5oQ81Fm';
    const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let dbData = { students: [], grades: [] };

    function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('hidden', !show); }

    async function fetchDB() {
        showLoading(true);
        try {
            let res = await fetch(BASE_URL, { headers: { 'X-Master-Key': API_KEY } });
            let json = await res.json();
            dbData = json.record || { students: [], grades: [] };
            if (!dbData.students) dbData.students = [];
            if (!dbData.grades) dbData.grades = [];
        } catch (e) { alert('کێشەی سێرڤەر!'); }
        showLoading(false);
    }

    async function updateDB() {
        showLoading(true);
        try {
            await fetch(BASE_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(dbData)
            });
        } catch (e) { alert('کێشەی پاشەکەوتکردن!'); }
        showLoading(false);
    }

    window.onload = function() {
        if (localStorage.getItem('is_manager') === 'true') {
            showDashboard();
        }
    }

    async function managerLogin() {
        let u = document.getElementById('mUser').value.trim();
        let p = document.getElementById('mPass').value.trim();
        if (u === 'muder' && p === 'ashna0101') {
            localStorage.setItem('is_manager', 'true');
            showDashboard();
        } else {
            let alertBox = document.getElementById('loginAlert');
            alertBox.innerText = 'پاسوۆرد هەڵەیە!';
            alertBox.classList.remove('hidden');
        }
    }

    async function showDashboard() {
        await fetchDB();
        document.getElementById('managerLoginSection').classList.add('hidden');
        document.getElementById('managerDashboard').classList.remove('hidden');
        filterStudents();
    }

    async function uploadGrade() {
        let studentUser = document.getElementById('targetStudentUser').value.trim();
        let subject = document.getElementById('gradeSubject').value.trim();
        let details = document.getElementById('gradeDetails').value.trim();

        if (!studentUser || !subject || !details) {
            let alertBox = document.getElementById('gradeAlert');
            alertBox.innerText = 'تکایە هەموو خانەکان پڕبکەرەوە!';
            alertBox.classList.remove('hidden');
            return;
        }

        await fetchDB();
        if (!dbData.students.some(s => s.username === studentUser)) {
            let alertBox = document.getElementById('gradeAlert');
            alertBox.innerText = 'ئەم یوزەری قوتابی بوونی نییە!';
            alertBox.classList.remove('hidden');
            return;
        }

        dbData.grades.push({ studentUser, subject, details, date: new Date().toLocaleDateString('en-GB') });
        await updateDB();

        let alertBox = document.getElementById('gradeAlert');
        alertBox.innerText = 'نمرە سەرکەوتووانە نێردرا!';
        alertBox.className = 'alert success';
        alertBox.classList.remove('hidden');
        document.getElementById('targetStudentUser').value = '';
        document.getElementById('gradeSubject').value = '';
        document.getElementById('gradeDetails').value = '';
    }

    async function filterStudents() {
        await fetchDB();
        let stageFilter = document.getElementById('filterStage').value;
        let classFilter = document.getElementById('filterClass').value.toLowerCase();
        let tbody = document.getElementById('studentsTableBody');
        tbody.innerHTML = '';

        let filtered = dbData.students.filter(s => {
            let matchStage = stageFilter === '' || s.stage === stageFilter;
            let matchClass = classFilter === '' || s.className.toLowerCase().includes(classFilter);
            return matchStage && matchClass;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7">هیچ قوتابییەک نەدۆزرایەوە</td></tr>`;
            return;
        }

        filtered.forEach(s => {
            tbody.innerHTML += `
                <tr>
                    <td>${s.name}</td>
                    <td>${s.fatherName}</td>
                    <td>${s.phone}</td>
                    <td>${s.stage}</td>
                    <td>${s.className}</td>
                    <td><code>${s.username}</code></td>
                    <td><button class="btn-danger" onclick="deleteStudent('${s.username}')">سڕینەوە</button></td>
                </tr>
            `;
        });
    }

    async function deleteStudent(username) {
        if (confirm('دڵنیای لە سڕینەوەی ئەم قوتابییە؟')) {
            dbData.students = dbData.students.filter(s => s.username !== username);
            dbData.grades = dbData.grades.filter(g => g.studentUser !== username);
            await updateDB();
            filterStudents();
        }
    }

    function logout() {
        localStorage.removeItem('is_manager');
        location.reload();
    }
</script>
</body>
</html>
